  <text x="1085" y="729" class="small">Use a broad descending C-turn</text>
  <text x="1085" y="755" class="small">inside stomach-shaped scenery.</text>

  <path d="M60 928H1010" stroke="#ccd8ce" stroke-width="2"/>
  <text x="60" y="962" class="label">THE SCIENCE</text>
  <text x="60" y="992" class="note">Gravity moves the marble. Peristalsis moves real food.</text>
  <text x="60" y="1022" class="note">The marble stays whole; real food breaks down and nutrients are absorbed.</text>
