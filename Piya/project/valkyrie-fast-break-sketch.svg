  <path d="M1050 174V1065" stroke="#ccd8ce" stroke-width="2"/>
  <text x="1085" y="205" font-size="25" font-weight="bold">BALLHALLA BUILD SPECS</text>
  <text x="1085" y="246" class="note">Marble: about 16 mm</text>
  <text x="1085" y="278" class="note">Clear channel: about 3-4 cm</text>
  <text x="1085" y="310" class="note">Funnel bore: at least 20 mm</text>
  <text x="1085" y="342" class="note">Test joints before decorating.</text>
  <path d="M1085 367H1440" stroke="#ccd8ce" stroke-width="2"/>
  <text x="1085" y="405" class="label">No motor. No uphill sections.</text>
  <text x="1085" y="437" class="note">1. Load a single marble.</text>
  <text x="1085" y="469" class="note">2. Lift the release gate.</text>
  <text x="1085" y="501" class="note">3. Catch it at the finish.</text>
  <text x="1085" y="533" class="note">4. Return it by hand.</text>
  <path d="M1085 561H1440" stroke="#ccd8ce" stroke-width="2"/>
  <text x="1085" y="600" class="label">Funnel jams?</text>
